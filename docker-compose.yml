services:

  postgres:
    image: postgres:17
    container_name: lifeai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeai
      POSTGRES_USER: lifeai
      POSTGRES_PASSWORD: lifeai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lifeai-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: lifeai-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lifeai.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
